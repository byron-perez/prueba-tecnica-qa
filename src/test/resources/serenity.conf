webdriver {
  base.url = "https://todo-app.serenity-js.org/#/"
  autodownload = true
}

serenity.take.screenshots = FOR_FAILURES

# Default fallback if no command line flag is given
headless.mode = false

serenity {
  project.name = "Demo Project using Serenity and Cucumber"
  test.root = "net.serenitybdd.demos.todos"
  tag.failures = "true"
  linked.tags = "issue"
  restart.browser.for.each = scenario
}

home.page = "https://todo-app.serenity-js.org/#/"

# Tells Serenity to use the firefox environment block below by default
environment = firefox

environments {
  chrome {
    webdriver {
      driver = chrome
      autodownload = true
      capabilities {
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = [
            "--remote-allow-origins=*",
            "--test-type",
            "--ignore-certificate-errors",
            "--window-size=1920,1080",
            "--incognito",
            "--disable-infobars",
            "--disable-gpu",
            "--disable-dev-shm-usage",
            "--disable-default-apps",
            "--disable-popup-blocking"
          ]
        }
      }
    }
  }

  firefox {
    webdriver {
      driver = firefox
      capabilities {
        browserName = "firefox"
        pageLoadStrategy = "normal"
        acceptInsecureCerts = true
        unhandledPromptBehavior = "dismiss"
        strictFileInteractability = true

        "moz:firefoxOptions" {
          args = ["--window-size=1920,1080"]
          prefs {
            "javascript.options.showInConsole": false
          }
          log {"level": "info"}
        }
      }
    }
  }
}